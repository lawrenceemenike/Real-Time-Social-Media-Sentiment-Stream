[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comintel-streaming-platform"
version = "1.0.0"
description = "Real-Time Social Intelligence Streaming Platform (ComIntel)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "langdetect>=1.0.9",
    "redis>=4.6.0",
    "aiokafka>=0.8.0",
    "pyarrow>=12.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
